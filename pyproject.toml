[project]
name = "mlops-fake-news"
version = "0.1.2"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi[standard]>=0.143.0",
    "faststream[rabbit]>=0.7.7",
    "greenlet>=3.5.6",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "loguru>=0.7.3",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.17.0",
    "testcontainers[rabbitmq]>=4.13.0",
]
ml = [
    "matplotlib>=3.11.2",
    "mlflow==3.16.1",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "psutil>=7.0.0",
]
web = [
    "asyncpg>=0.32.0",
    "fastapi>=0.143.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select  = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"

[tool.coverage.run]
concurrency = ["thread", "greenlet"]
