name: CD

on:
  push:
    tags: ["v*"] # запуск workflow только если tag = v...

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml # переиспользование ci

  publish:
    needs: checks
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Check release version
        id: release
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text())
          version = project["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]

          if tag != f"v{version}":
              raise SystemExit(
                  f"Git tag {tag!r} does not match project version {version!r}"
              )

          image = f"ghcr.io/{os.environ['GITHUB_REPOSITORY'].lower()}"

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"version={version}", file=output)
              print(f"image={image}", file=output)
          PY

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
            ${{ steps.release.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
