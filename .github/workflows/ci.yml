name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql+asyncpg://app:test_password@127.0.0.1:5432/fake_news_test

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: fake_news_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d fake_news_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.13.0"

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --group web --group dev

      - name: Check code
        run: uv run --locked --group web --group dev ruff check .

      - name: Check formatting
        run: uv run --locked --group web --group dev ruff format --check .

      - name: Run tests with coverage
        run: >-
          uv run --locked --group web --group dev python -m pytest
          --cov=app
          --cov-report=term-missing
          --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore
