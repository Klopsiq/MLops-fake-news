services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: fake_news
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d fake_news"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    image: fake-news:0.1.0
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://app:local_dev_password@db:5432/fake_news
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
