services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: fake_news
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d fake_news"]
      interval: 5s
      timeout: 3s
      retries: 10

  mlflow-db:
    image: postgres:17
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow_local_password
      POSTGRES_DB: mlflow
    volumes:
      - mlflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  mlflow:
    build:
      context: .
      dockerfile: infra/mlflow/Dockerfile
    image: fake-news-mlflow:3.16.1
    ports:
      - "127.0.0.1:5000:5000"
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - postgresql+psycopg2://mlflow:mlflow_local_password@mlflow-db:5432/mlflow
      - --serve-artifacts
      - --artifacts-destination
      - /mlartifacts
      - --allowed-hosts
      - "localhost:*,127.0.0.1:*,mlflow:*"
    volumes:
      - mlflow_artifacts:/mlartifacts
    depends_on:
      mlflow-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  app:
    build: .
    image: fake-news:0.1.0
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://app:local_dev_password@db:5432/fake_news
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_NAME: fake-news-classifier
      MODEL_ALIAS: champion
    depends_on:
      db:
        condition: service_healthy
      mlflow:
        condition: service_healthy

volumes:
  postgres_data:
  mlflow_postgres_data:
  mlflow_artifacts:
